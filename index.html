<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!--HEAD-->
<title>Zielona Parka</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
/* Layout: one full-screen canvas; HUD pinned to the corners; menus as a centred night-street poster. */
:root{
  color-scheme: dark;
  --night:#11151f;      /* asphalt at night */
  --panel:#1a2030;
  --ink:#eef1f6;
  --dim:#9aa3b5;
  --parka:#6f8a35;      /* the jacket */
  --fur:#d2ab6c;        /* hood trim */
  --siren-r:#ff3b4e;
  --siren-b:#3d7bff;
  --cash:#ffd23f;
  --display:"Bungee","Impact","Arial Black",sans-serif;
  --body:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:18px;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:100%;height:100%;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}

.hud{position:absolute;pointer-events:none;font-variant-numeric:tabular-nums}
#hudL{top:10px;left:max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:6px}
#score{font-family:var(--display);font-size:26px;line-height:1;text-shadow:0 2px 0 #000}
#stars{font-size:20px;letter-spacing:3px;color:var(--cash);text-shadow:0 2px 0 #000}
#stars i{font-style:normal;color:#ffffff40}
#bar{width:150px;height:10px;background:#000a;border:2px solid #000;border-radius:6px;overflow:hidden}
#bar b{display:block;height:100%;width:100%;background:var(--parka)}
#bar.boost b{background:var(--cash)}
#status{align-self:flex-start;font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 8px;border-radius:4px;background:#000a;color:var(--dim)}
#status.seen{background:var(--siren-r);color:#fff}
#status.hid{background:var(--parka);color:#fff}
#mini{top:10px;right:max(16px, env(safe-area-inset-right, 0px));border:2px solid #000;border-radius:4px;
  width:128px;height:96px;image-rendering:pixelated;opacity:.9}

#sprint{position:absolute;right:max(22px, env(safe-area-inset-right, 0px));bottom:calc(26px + env(safe-area-inset-bottom, 0px));
  width:92px;height:92px;border-radius:50%;border:3px solid #fff8;background:#6f8a3599;color:#fff;
  font-family:var(--display);font-size:15px;touch-action:none}
#sprint.on{background:var(--parka);border-color:#fff}
#stick{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:3px solid #fff5;
  background:#fff1;pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff9}

.screen{position:absolute;inset:0;display:flex;
  padding-block:16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:linear-gradient(#11151fd9,#11151ff2);overflow:auto}
.card{margin:auto;width:100%;max-width:430px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.card h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,10vw,54px);line-height:.95;margin:0;
  text-wrap:balance;color:var(--ink);text-shadow:4px 4px 0 var(--parka)}
.card h1 span{color:var(--fur)}
.card p{margin:0;color:var(--dim);font-size:19px;line-height:1.3;max-width:34ch}
.card .big{font-family:var(--display);font-size:44px;color:var(--cash);line-height:1}
.card .keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;font-size:17px;color:var(--ink)}
.card .keys b{color:var(--fur);font-weight:700}
#hero{width:106px;height:120px}
.tape{align-self:stretch;height:10px;border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--siren-r) 0 24px,var(--siren-b) 24px 48px)}
button.go{font-family:var(--display);font-size:24px;color:#11151f;background:var(--cash);border:0;border-radius:6px;
  padding:12px 30px;box-shadow:0 5px 0 #a98600;cursor:pointer}
button.go:active{transform:translateY(4px);box-shadow:0 1px 0 #a98600}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
<!--/HEAD-->
</head>
<body>
<!--BODY-->
<div id="stage">
  <canvas id="game"></canvas>

  <div class="hud" id="hudL" hidden>
    <div id="score">0</div>
    <div id="stars"></div>
    <div id="bar"><b></b></div>
    <div id="status">Szukają cię</div>
  </div>
  <canvas class="hud" id="mini" width="128" height="96" hidden></canvas>

  <div id="stick" hidden><i></i></div>
  <button id="sprint" hidden>SPRINT</button>

  <div class="screen" id="menu">
    <div class="card">
      <div class="tape"></div>
      <h1>Zielona <span>Parka</span></h1>
      <canvas id="hero" width="300" height="340"></canvas>
      <p>Ktoś zadzwonił na policję. Biegnij przez miasto, gub pościg w zaułkach i chowaj się w krzakach.</p>
      <div class="keys">
        <b>WASD / strzałki</b><span>bieg (na telefonie: przeciągnij palcem)</span>
        <b>Shift / Spacja</b><span>sprint, zużywa kondycję</span>
        <b>Banknoty</b><span>+100 punktów</span>
        <b>Energetyk</b><span>5 sekund sprintu bez limitu</span>
      </div>
      <button class="go" id="start">UCIEKAJ</button>
      <div class="tape"></div>
    </div>
  </div>

  <div class="screen" id="over" hidden>
    <div class="card">
      <div class="tape"></div>
      <h1>Złapany!</h1>
      <div class="big" id="final">0</div>
      <p id="summary"></p>
      <button class="go" id="again">JESZCZE RAZ</button>
      <div class="tape"></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const T = 40, W = 64, H = 48, N = W * H, WALL = 18;
const ROAD = 0, WALK = 1, BLD = 2, GRASS = 3, TREE = 4, BUSH = 5, WATER = 6, PLAZA = 7, ALLEY = 8;
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];

let map, bid, bcol, reach, roadsX, roadsY, floorCv, miniBase;
let player, cops, items, floats, time, cash, level, lastKnown, seen, seenT, state = 'menu', best = 0;
try { best = +localStorage.getItem('parka-best') || 0; } catch (e) {}

const solid = t => t === BLD || t === TREE || t === WATER;
const tileAt = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? BLD : map[y * W + x];
const blocked = (px, py, r) => {
  const x0 = Math.floor((px - r) / T), x1 = Math.floor((px + r) / T);
  const y0 = Math.floor((py - r) / T), y1 = Math.floor((py + r) / T);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (solid(tileAt(x, y))) return true;
  return false;
};

/* ---------- map ---------- */
function cuts(len) {
  const out = []; let p = 1;
  for (;;) {
    out.push(p);
    const rem = len - 3 - (p + 2);
    if (rem <= 13) { out.push(len - 3); break; }
    p += 2 + ri(6, Math.min(9, rem - 8));
  }
  return out;
}
const ROOFS = ['#b5533c', '#8d6e58', '#6d7f8c', '#a08a5e', '#7b5c7a', '#56788a', '#9c4b4b', '#77806a', '#c08a4a'];
function genMap() {
  map = new Uint8Array(N).fill(BLD); bid = new Uint16Array(N); bcol = ['#2b2f3a'];
  roadsX = cuts(W); roadsY = cuts(H);
  for (const x of roadsX) for (let y = 1; y < H - 1; y++) { map[y * W + x] = ROAD; map[y * W + x + 1] = ROAD; }
  for (const y of roadsY) for (let x = 1; x < W - 1; x++) { map[y * W + x] = ROAD; map[(y + 1) * W + x] = ROAD; }
  for (let i = 0; i < roadsX.length - 1; i++) for (let j = 0; j < roadsY.length - 1; j++) {
    const x0 = roadsX[i] + 2, x1 = roadsX[i + 1] - 1, y0 = roadsY[j] + 2, y1 = roadsY[j + 1] - 1;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) map[y * W + x] = WALK;
    const ix0 = x0 + 1, ix1 = x1 - 1, iy0 = y0 + 1, iy1 = y1 - 1, iw = ix1 - ix0 + 1, ih = iy1 - iy0 + 1;
    const r = Math.random();
    if (r < 0.24) {                                   // park
      for (let y = iy0; y <= iy1; y++) for (let x = ix0; x <= ix1; x++) {
        const q = Math.random();
        map[y * W + x] = q < 0.11 ? TREE : q < 0.26 ? BUSH : GRASS;
      }
      if (iw >= 5 && ih >= 5 && Math.random() < 0.6) {
        const px = ri(ix0 + 1, ix1 - 2), py = ri(iy0 + 1, iy1 - 2);
        for (let y = py; y < py + 2; y++) for (let x = px; x < px + 2; x++) map[y * W + x] = WATER;
      }
    } else if (r < 0.31) {                            // plaza
      for (let y = iy0; y <= iy1; y++) for (let x = ix0; x <= ix1; x++)
        map[y * W + x] = Math.random() < 0.06 ? TREE : PLAZA;
    } else {                                          // buildings split by alleys
      const ax = iw >= 5 && Math.random() < 0.75 ? ri(ix0 + 2, ix1 - 2) : -1;
      const ay = ih >= 5 && Math.random() < 0.75 ? ri(iy0 + 2, iy1 - 2) : -1;
      const xs = ax < 0 ? [[ix0, ix1]] : [[ix0, ax - 1], [ax + 1, ix1]];
      const ys = ay < 0 ? [[iy0, iy1]] : [[iy0, ay - 1], [ay + 1, iy1]];
      for (let y = iy0; y <= iy1; y++) for (let x = ix0; x <= ix1; x++) map[y * W + x] = ALLEY;
      for (const [a, b] of xs) for (const [c, d] of ys) {
        const id = bcol.length; bcol.push(pick(ROOFS));
        for (let y = c; y <= d; y++) for (let x = a; x <= b; x++) { map[y * W + x] = BLD; bid[y * W + x] = id; }
      }
    }
  }
  // reachable set from the start crossing
  const sx = roadsX[roadsX.length >> 1], sy = roadsY[roadsY.length >> 1];
  reach = new Uint8Array(N);
  const f = new Int16Array(N); bfs(f, sx, sy);
  for (let i = 0; i < N; i++) reach[i] = f[i] < 32767 ? 1 : 0;
  paintFloor();
  return { x: (sx + 1) * T, y: (sy + 1) * T };
}

const queue = new Int32Array(N);
function bfs(f, tx, ty) {
  f.fill(32767);
  if (solid(tileAt(tx, ty))) return;
  let h = 0, t = 0; const s = ty * W + tx; f[s] = 0; queue[t++] = s;
  while (h < t) {
    const c = queue[h++], d = f[c] + 1, x = c % W;
    if (x > 0 && f[c - 1] > d && !solid(map[c - 1])) { f[c - 1] = d; queue[t++] = c - 1; }
    if (x < W - 1 && f[c + 1] > d && !solid(map[c + 1])) { f[c + 1] = d; queue[t++] = c + 1; }
    if (c >= W && f[c - W] > d && !solid(map[c - W])) { f[c - W] = d; queue[t++] = c - W; }
    if (c < N - W && f[c + W] > d && !solid(map[c + W])) { f[c + W] = d; queue[t++] = c + W; }
  }
}

function paintFloor() {
  floorCv = document.createElement('canvas'); floorCv.width = W * T; floorCv.height = H * T;
  const g = floorCv.getContext('2d');
  const base = { [ROAD]: '#353942', [WALK]: '#8f939b', [BLD]: '#22252e', [GRASS]: '#4f8f45', [TREE]: '#4f8f45',
    [BUSH]: '#4f8f45', [WATER]: '#3b79b5', [PLAZA]: '#b3a487', [ALLEY]: '#6c6f78' };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const t = map[y * W + x], px = x * T, py = y * T;
    g.fillStyle = base[t]; g.fillRect(px, py, T, T);
    if (t === WALK || t === PLAZA || t === ALLEY) {
      g.strokeStyle = '#0000001c'; g.lineWidth = 1; g.strokeRect(px + .5, py + .5, T / 2, T / 2);
      g.strokeRect(px + T / 2 + .5, py + T / 2 + .5, T / 2, T / 2);
    } else if (t === GRASS || t === TREE || t === BUSH) {
      g.fillStyle = '#ffffff12';
      for (let k = 0; k < 4; k++) g.fillRect(px + rnd(2, T - 4), py + rnd(2, T - 4), 2, 4);
      if (map[y * W + x] === TREE && bid[y * W + x] === 0 && tileAt(x, y - 1) === PLAZA) { g.fillStyle = base[PLAZA]; g.fillRect(px, py, T, T); }
    } else if (t === WATER) {
      g.fillStyle = '#ffffff30'; g.fillRect(px + rnd(4, 20), py + rnd(6, 30), 12, 2);
    } else if (t === ROAD && Math.random() < 0.05) {
      g.fillStyle = '#00000022'; g.fillRect(px + rnd(4, 20), py + rnd(4, 20), rnd(6, 14), rnd(4, 9));
    }
  }
  g.fillStyle = '#e8e2c4';
  for (const x of roadsX) for (let y = T; y < (H - 1) * T; y += 28) g.fillRect((x + 1) * T - 2, y, 4, 14);
  for (const y of roadsY) for (let x = T; x < (W - 1) * T; x += 28) g.fillRect(x, (y + 1) * T - 2, 14, 4);
  g.fillStyle = '#353942';
  for (const x of roadsX) for (const y of roadsY) g.fillRect(x * T, y * T, 2 * T, 2 * T);
  g.fillStyle = '#e9e9e9';                                    // zebra crossings
  for (const x of roadsX) for (const y of roadsY) for (let k = 0; k < 6; k++) {
    g.fillRect(x * T + 5 + k * 13, y * T - 16, 7, 14); g.fillRect(x * T + 5 + k * 13, (y + 2) * T + 2, 7, 14);
    g.fillRect(x * T - 16, y * T + 5 + k * 13, 14, 7); g.fillRect((x + 2) * T + 2, y * T + 5 + k * 13, 14, 7);
  }
  miniBase = document.createElement('canvas'); miniBase.width = W * 2; miniBase.height = H * 2;
  const m = miniBase.getContext('2d');
  const mc = { [ROAD]: '#4a4f5c', [WALK]: '#8f939b', [BLD]: '#1c1f27', [GRASS]: '#4f8f45', [TREE]: '#2f6b33',
    [BUSH]: '#3d7d3a', [WATER]: '#3b79b5', [PLAZA]: '#b3a487', [ALLEY]: '#6c6f78' };
  for (let i = 0; i < N; i++) { m.fillStyle = mc[map[i]]; m.fillRect((i % W) * 2, Math.floor(i / W) * 2, 2, 2); }
}

/* ---------- entities ---------- */
function randomSpot(far) {
  for (let k = 0; k < 400; k++) {
    const x = ri(1, W - 2), y = ri(1, H - 2), i = y * W + x;
    if (!reach[i] || map[i] === BUSH) continue;
    if (far && Math.hypot(x * T - player.x, y * T - player.y) < far * T) continue;
    return { x: (x + .5) * T, y: (y + .5) * T };
  }
  return { x: player.x, y: player.y };
}
function addCop() {
  const p = randomSpot(15);
  cops.push({ x: p.x, y: p.y, f: new Int16Array(N), tx: -1, ty: -1, ft: Math.random() * .3, mode: 'chase',
    st: 0, ph: Math.random() * 6, dir: 1, back: false, sees: false, vx: 0, vy: 0 });
}
function addItem(kind) { const p = randomSpot(4); items.push({ x: p.x, y: p.y, kind, ph: Math.random() * 6 }); }

function reset() {
  const s = genMap();
  player = { x: s.x, y: s.y, vx: 0, vy: 0, stam: 1, rest: 0, boost: 0, ph: 0, dir: 1, back: false, moving: false, hid: false, sprint: false };
  cops = []; items = []; floats = []; time = 0; cash = 0; level = 1; seen = false; seenT = 0;
  lastKnown = { x: s.x, y: s.y };
  for (let i = 0; i < 14; i++) addItem('cash');
  for (let i = 0; i < 3; i++) addItem('drink');
  addCop(); addCop();
}

function los(ax, ay, bx, by) {
  const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d / 12);
  for (let i = 1; i < n; i++) {
    const t = tileAt(Math.floor((ax + (bx - ax) * i / n) / T), Math.floor((ay + (by - ay) * i / n) / T));
    if (t === BLD || t === TREE) return false;
  }
  return true;
}
function move(e, dx, dy, r) {
  e.x += dx; if (blocked(e.x, e.y, r)) e.x -= dx;
  e.y += dy; if (blocked(e.y === e.y ? e.x : 0, e.y, r)) e.y -= dy;
}

/* ---------- input ---------- */
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Enter' && state !== 'play') startGame();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
let touchSprint = false, isTouch = false;
const stick = $('stick'), sprintBtn = $('sprint');
cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || e.pointerType === 'mouse') return;
  if (!isTouch) { isTouch = true; sprintBtn.hidden = false; }
  if (joy.id !== null) return;
  joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.x = joy.y = 0;
  const r = $('stage').getBoundingClientRect();
  stick.style.left = (e.clientX - r.left) + 'px'; stick.style.top = (e.clientY - r.top) + 'px';
  stick.firstElementChild.style.transform = ''; stick.hidden = false;
});
addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy; const d = Math.hypot(dx, dy), m = 48;
  if (d > m) { dx *= m / d; dy *= m / d; }
  joy.x = dx / m; joy.y = dy / m;
  stick.firstElementChild.style.transform = `translate(${dx}px,${dy}px)`;
});
const joyEnd = e => { if (e.pointerId === joy.id) { joy.id = null; joy.x = joy.y = 0; stick.hidden = true; } };
addEventListener('pointerup', joyEnd); addEventListener('pointercancel', joyEnd);
sprintBtn.addEventListener('pointerdown', e => { e.preventDefault(); touchSprint = true; sprintBtn.classList.add('on'); });
const spEnd = () => { touchSprint = false; sprintBtn.classList.remove('on'); };
sprintBtn.addEventListener('pointerup', spEnd); sprintBtn.addEventListener('pointercancel', spEnd);
sprintBtn.addEventListener('pointerleave', spEnd);
addEventListener('contextmenu', e => e.preventDefault());

/* ---------- sound ---------- */
let ac = null;
function beep(freq, dur, type, vol, slide) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(vol || .05, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}

/* ---------- update ---------- */
const COPS_PER_LEVEL = [2, 3, 5, 7, 9];
function update(dt) {
  time += dt;
  const nl = Math.min(5, 1 + Math.floor(time / 20));
  if (nl !== level) { level = nl; beep(520, .25, 'square', .05, 880); floats.push({ x: player.x, y: player.y - 60, t: 0, txt: 'POŚCIG ROŚNIE!', c: '#ff3b4e' }); }
  while (cops.length < COPS_PER_LEVEL[level - 1]) addCop();

  // player
  let ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x;
  let iy = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0) + joy.y;
  const im = Math.hypot(ix, iy); if (im > 1) { ix /= im; iy /= im; }
  const p = player;
  p.moving = im > .15;
  const wantSprint = (keys.ShiftLeft || keys.ShiftRight || keys.Space || touchSprint) && p.moving;
  p.boost = Math.max(0, p.boost - dt);
  p.sprint = wantSprint && (p.stam > 0 || p.boost > 0);
  if (p.sprint && p.boost <= 0) { p.stam = Math.max(0, p.stam - dt / 2.8); p.rest = .5; }
  else if (!wantSprint) { p.rest -= dt; if (p.rest <= 0) p.stam = Math.min(1, p.stam + dt / 5); }
  const sp = p.sprint ? 265 : 170;
  p.vx = ix * sp; p.vy = iy * sp;
  move(p, p.vx * dt, p.vy * dt, 10);
  if (p.moving) { p.ph += dt * (p.sprint ? 17 : 11); if (Math.abs(ix) > .2) p.dir = ix > 0 ? 1 : -1; p.back = iy < -.5 && Math.abs(iy) > Math.abs(ix); }
  p.hid = tileAt(Math.floor(p.x / T), Math.floor(p.y / T)) === BUSH;

  // items
  for (const it of items) {
    it.ph += dt * 4;
    if (Math.hypot(it.x - p.x, it.y - p.y) < 24) {
      if (it.kind === 'cash') { cash += 100; floats.push({ x: it.x, y: it.y - 20, t: 0, txt: '+100', c: '#ffd23f' }); beep(880, .12, 'square', .04, 1320); }
      else { p.stam = 1; p.boost = 5; floats.push({ x: it.x, y: it.y - 20, t: 0, txt: 'ENERGIA!', c: '#7df' }); beep(330, .3, 'sawtooth', .04, 990); }
      const q = randomSpot(8); it.x = q.x; it.y = q.y;
    }
  }
  for (const f of floats) { f.t += dt; f.y -= 30 * dt; }
  floats = floats.filter(f => f.t < 1.1);

  // police
  const ptx = Math.floor(p.x / T), pty = Math.floor(p.y / T);
  let any = false;
  for (const c of cops) {
    const d = Math.hypot(c.x - p.x, c.y - p.y);
    c.sees = d < 9 * T && (!p.hid || d < 70) && los(c.x, c.y - 4, p.x, p.y - 4);
    if (c.sees) any = true;
  }
  if (any && !seen) beep(700, .18, 'square', .05, 1000);
  seen = any; seenT = any ? 0 : seenT + dt;
  if (any) { lastKnown.x = p.x; lastKnown.y = p.y; }
  const cs = (150 + level * 9);
  cops.forEach((c, idx) => {
    const d = Math.hypot(c.x - p.x, c.y - p.y);
    let tx, ty;
    if (any) {
      c.mode = 'chase'; tx = ptx; ty = pty;
      if (idx % 2 === 1 && d > 6 * T && p.moving) {            // odd cops try to cut you off
        const fx = ptx + Math.round(p.vx / 265 * 4), fy = pty + Math.round(p.vy / 265 * 4);
        if (fx > 0 && fy > 0 && fx < W && fy < H && reach[fy * W + fx]) { tx = fx; ty = fy; }
      }
    } else if (c.mode === 'chase') {
      tx = Math.floor(lastKnown.x / T); ty = Math.floor(lastKnown.y / T);
      if (Math.hypot(c.x - lastKnown.x, c.y - lastKnown.y) < 1.6 * T) { c.mode = 'search'; c.st = 0; }
    }
    if (c.mode === 'search') {
      c.st -= dt;
      const arrived = c.tx >= 0 && Math.hypot(c.x - (c.tx + .5) * T, c.y - (c.ty + .5) * T) < T * .7;
      if (c.st <= 0 || arrived) {
        c.st = rnd(3, 6);
        for (let k = 0; k < 30; k++) {
          const sx = Math.floor(lastKnown.x / T) + ri(-8, 8), sy = Math.floor(lastKnown.y / T) + ri(-8, 8);
          if (sx > 0 && sy > 0 && sx < W && sy < H && reach[sy * W + sx]) { c.tx = sx; c.ty = sy; c.ft = 0; break; }
        }
      }
      tx = c.tx; ty = c.ty;
    }
    c.ft -= dt;
    if (c.ft <= 0 || c.tx < 0) { c.tx = tx; c.ty = ty; bfs(c.f, tx, ty); c.ft = .25 + Math.random() * .1; }

    let gx, gy;
    if (c.sees && d < 5 * T) { gx = p.x; gy = p.y; }
    else {
      const cx = Math.floor(c.x / T), cy = Math.floor(c.y / T), ci = cy * W + cx;
      let bestD = c.f[ci], bi = -1;
      for (const o of [-1, 1, -W, W]) { const n = ci + o; if (n >= 0 && n < N && c.f[n] < bestD) { bestD = c.f[n]; bi = n; } }
      if (bi < 0) { gx = (c.tx + .5) * T; gy = (c.ty + .5) * T; if (c.f[ci] >= 32767) { gx = c.x; gy = c.y; c.st = 0; } }
      else { gx = (bi % W + .5) * T; gy = (Math.floor(bi / W) + .5) * T; }
    }
    let dx = gx - c.x, dy = gy - c.y; const dm = Math.hypot(dx, dy);
    const v = cs * (c.mode === 'search' ? .7 : 1) * (1 - idx % 3 * .04);
    if (dm > 2) { dx = dx / dm * v; dy = dy / dm * v; } else dx = dy = 0;
    for (const o of cops) if (o !== c) {
      const sx = c.x - o.x, sy = c.y - o.y, sd = Math.hypot(sx, sy);
      if (sd < 24 && sd > .01) { dx += sx / sd * 60; dy += sy / sd * 60; }
    }
    c.vx = dx; c.vy = dy;
    move(c, dx * dt, dy * dt, 9);
    if (Math.hypot(dx, dy) > 10) { c.ph += dt * 13; if (Math.abs(dx) > 20) c.dir = dx > 0 ? 1 : -1; c.back = dy < -40 && Math.abs(dy) > Math.abs(dx); }
    if (d < 19) caught();
  });
}

function caught() {
  if (state !== 'play') return;
  state = 'over';
  const sc = score();
  const rec = sc > best;
  if (rec) { best = sc; try { localStorage.setItem('parka-best', String(best)); } catch (e) {} }
  beep(400, .6, 'sawtooth', .07, 80);
  $('final').textContent = sc.toLocaleString('pl-PL');
  $('summary').textContent = `Uciekałeś ${Math.floor(time)} s i zgarnąłeś ${cash} zł. ` + (rec ? 'Nowy rekord!' : `Rekord: ${best.toLocaleString('pl-PL')}.`);
  setTimeout(() => { $('over').hidden = false; $('hudL').hidden = true; $('mini').hidden = true; sprintBtn.hidden = true; stick.hidden = true; joy.id = null; joy.x = joy.y = 0; }, 700);
}
const score = () => Math.floor(time * 10) + cash;

/* ---------- drawing ---------- */
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); g.fill(); }
function shadow(g) { g.fillStyle = '#00000045'; g.beginPath(); g.ellipse(0, 0, 11, 4.5, 0, 0, 7); g.fill(); }

// The runner: olive parka, fur-trimmed hood, black beanie, backpack, white earphones.
function drawGuy(g, x, y, ph, dir, back, moving) {
  g.save(); g.translate(x, y); shadow(g); g.scale(dir, 1);
  const s = moving ? Math.sin(ph) : 0, bob = moving ? Math.abs(Math.cos(ph)) * 2 : 0;
  g.fillStyle = '#23262e'; g.fillRect(-7, -11 + Math.min(0, s * 3), 6, 10); g.fillRect(1, -11 + Math.min(0, -s * 3), 6, 10);
  g.fillStyle = '#e9e9e9'; g.fillRect(-8, -2 + Math.min(0, s * 3), 7, 3); g.fillRect(1, -2 + Math.min(0, -s * 3), 7, 3);
  g.translate(0, -bob);
  g.fillStyle = '#566c28'; rr(g, -14, -27 + s * 2, 5, 14, 2); rr(g, 9, -27 - s * 2, 5, 14, 2);        // arms
  g.fillStyle = '#6f8a35'; rr(g, -10, -30, 20, 21, 5);                                                // parka
  g.fillStyle = '#566c28'; g.fillRect(-10, -12, 20, 3);
  if (back) {
    g.fillStyle = '#17181d'; rr(g, -8, -29, 16, 17, 4);                                               // backpack
    g.fillStyle = '#f1f1f1'; g.fillRect(-5, -22, 2, 8);
  } else {
    g.fillStyle = '#17181d'; g.fillRect(-8, -29, 3, 13); g.fillRect(5, -29, 3, 13);                   // straps
    g.fillStyle = '#3d4d1c'; g.fillRect(-.5, -29, 1, 19);                                             // zip
    g.strokeStyle = '#fff'; g.lineWidth = 1; g.beginPath(); g.moveTo(-5, -34); g.quadraticCurveTo(-3, -24, 1, -15); g.stroke(); // earphone wire
  }
  // fur hood
  g.fillStyle = '#d2ab6c';
  for (let a = 0; a < 12; a++) { g.beginPath(); g.arc(Math.cos(a * .524) * 8, -38 + Math.sin(a * .524) * 8, 4, 0, 7); g.fill(); }
  g.fillStyle = '#9c7a45';
  for (let a = 0; a < 12; a += 2) g.fillRect(Math.cos(a * .524 + .3) * 9 - 1, -38 + Math.sin(a * .524 + .3) * 9 - 1, 2, 2);
  if (back) { g.fillStyle = '#6f8a35'; g.beginPath(); g.arc(0, -38, 7.5, 0, 7); g.fill(); g.fillStyle = '#566c28'; g.fillRect(-.5, -45, 1, 14); }
  else {
    g.fillStyle = '#e3b48f'; g.beginPath(); g.arc(0, -37, 6.5, 0, 7); g.fill();                       // face
    g.fillStyle = '#111'; g.beginPath(); g.arc(0, -39, 7, Math.PI, 0); g.fill(); g.fillRect(-7, -40, 14, 2.5); // beanie
    g.fillRect(-3.5, -36, 2, 1.5); g.fillRect(1.5, -36, 2, 1.5);
  }
  g.restore();
}
function drawCop(g, c) {
  g.save(); g.translate(c.x, c.y + 8); shadow(g); g.scale(c.dir, 1);
  const mv = Math.hypot(c.vx, c.vy) > 10, s = mv ? Math.sin(c.ph) : 0, bob = mv ? Math.abs(Math.cos(c.ph)) * 2 : 0;
  g.fillStyle = '#141c33'; g.fillRect(-7, -11 + Math.min(0, s * 3), 6, 11); g.fillRect(1, -11 + Math.min(0, -s * 3), 6, 11);
  g.translate(0, -bob);
  g.fillStyle = '#182446'; rr(g, -13, -27 + s * 2, 5, 14, 2); rr(g, 8, -27 - s * 2, 5, 14, 2);
  g.fillStyle = '#22336a'; rr(g, -9, -30, 18, 21, 4);
  g.fillStyle = '#d7ff3f'; g.fillRect(-9, -21, 18, 3);
  g.fillStyle = '#fff'; g.fillRect(-9, -18, 18, 1);
  g.fillStyle = '#e8bf9e'; g.beginPath(); g.arc(0, -36, 6, 0, 7); g.fill();
  g.fillStyle = '#16203f'; g.beginPath(); g.arc(0, -38, 6.5, Math.PI, 0); g.fill(); g.fillRect(-8, -39, 16, 2.5);
  if (!c.back) { g.fillStyle = '#c9cdd6'; g.fillRect(-1.5, -43, 3, 3); g.fillStyle = '#111'; g.fillRect(-3.5, -35, 2, 1.5); g.fillRect(1.5, -35, 2, 1.5); }
  g.restore();
  g.font = '700 16px Bungee, Impact, sans-serif'; g.textAlign = 'center';
  if (c.sees) { g.fillStyle = Math.floor(time * 6) % 2 ? '#ff3b4e' : '#3d7bff'; g.fillText('!', c.x, c.y - 44); }
  else if (c.mode === 'search') { g.fillStyle = '#fff'; g.fillText('?', c.x, c.y - 44); }
}
function drawItem(g, it) {
  const y = it.y + Math.sin(it.ph) * 3;
  g.fillStyle = '#00000040'; g.beginPath(); g.ellipse(it.x, it.y + 10, 9, 3, 0, 0, 7); g.fill();
  if (it.kind === 'cash') {
    g.fillStyle = '#2f9e52'; rr(g, it.x - 11, y - 6, 22, 13, 2);
    g.fillStyle = '#ffd23f'; g.beginPath(); g.arc(it.x, y + .5, 4, 0, 7); g.fill();
    g.strokeStyle = '#c9f5d4'; g.lineWidth = 1; g.strokeRect(it.x - 9.5, y - 4.5, 19, 10);
  } else {
    g.fillStyle = '#2ad1e8'; rr(g, it.x - 6, y - 11, 12, 20, 3);
    g.fillStyle = '#11151f'; g.fillRect(it.x - 6, y - 3, 12, 5);
    g.fillStyle = '#cfd6e0'; g.fillRect(it.x - 5, y - 12, 10, 3);
  }
}

let vw = 0, vh = 0, zoom = 1, dpr = 1;
function resize() {
  const r = cv.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  vw = r.width; vh = r.height; cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  zoom = Math.max(.75, Math.min(1.5, Math.min(vw, vh) / 470));
}
addEventListener('resize', resize);

function render() {
  const p = player, g = ctx;
  const sw = vw / zoom, sh = vh / zoom;
  const cx = Math.max(0, Math.min(W * T - sw, p.x - sw / 2)), cy = Math.max(0, Math.min(H * T - sh, p.y - sh / 2));
  const camX = sw > W * T ? (W * T - sw) / 2 : cx, camY = sh > H * T ? (H * T - sh) / 2 : cy;
  g.setTransform(dpr * zoom, 0, 0, dpr * zoom, 0, 0);
  g.fillStyle = '#11151f'; g.fillRect(0, 0, sw, sh);
  g.translate(-Math.round(camX), -Math.round(camY));
  g.imageSmoothingEnabled = false;
  g.drawImage(floorCv, camX, camY, Math.min(sw, W * T - camX), Math.min(sh, H * T - camY), camX, camY, Math.min(sw, W * T - camX), Math.min(sh, H * T - camY));

  if (!seen && seenT < 12 && state === 'play') {                    // last known position marker
    g.strokeStyle = '#ff3b4e'; g.lineWidth = 2; g.setLineDash([6, 5]);
    g.beginPath(); g.arc(lastKnown.x, lastKnown.y + 6, 16 + Math.sin(time * 5) * 2, 0, 7); g.stroke(); g.setLineDash([]);
  }
  for (const it of items) drawItem(g, it);

  const x0 = Math.max(0, Math.floor(camX / T) - 1), x1 = Math.min(W - 1, Math.floor((camX + sw) / T) + 1);
  const y0 = Math.max(0, Math.floor(camY / T) - 1), y1 = Math.min(H - 1, Math.floor((camY + sh) / T) + 2);
  const ents = cops.map(c => ({ y: c.y, c })); ents.push({ y: p.y, p: true }); ents.sort((a, b) => a.y - b.y);
  let ei = 0;
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      const i = ty * W + tx, t = map[i], px = tx * T, py = ty * T;
      if (t === BLD) {
        const col = bcol[bid[i]];
        if (tileAt(tx, ty + 1) !== BLD) {
          g.fillStyle = col; g.fillRect(px, py + T - WALL, T, WALL);
          g.fillStyle = '#00000066'; g.fillRect(px, py + T - WALL, T, WALL);
          if (bid[i]) { g.fillStyle = (tx * 7 + ty * 3) % 5 < 3 ? '#ffe49a' : '#39404f'; g.fillRect(px + 6, py + T - 13, 10, 8); g.fillRect(px + 24, py + T - 13, 10, 8); }
        }
        g.fillStyle = col; g.fillRect(px, py - WALL, T, T);
        g.fillStyle = '#ffffff14'; g.fillRect(px, py - WALL, T, 3);
        g.fillStyle = '#00000030';
        if (bid[i - 1] !== bid[i] || map[i - 1] !== BLD) g.fillRect(px, py - WALL, 2, T);
        if (bid[i + 1] !== bid[i] || map[i + 1] !== BLD) g.fillRect(px + T - 2, py - WALL, 2, T);
        if (tileAt(tx, ty - 1) !== BLD || bid[i - W] !== bid[i]) g.fillRect(px, py - WALL, T, 2);
        if (bid[i] && (tx * 13 + ty * 7) % 11 === 0) { g.fillStyle = '#00000035'; g.fillRect(px + 12, py - WALL + 12, 14, 12); }
      } else if (t === TREE) {
        g.fillStyle = '#00000035'; g.beginPath(); g.ellipse(px + 20, py + 32, 15, 6, 0, 0, 7); g.fill();
        g.fillStyle = '#5b4028'; g.fillRect(px + 17, py + 16, 6, 16);
        g.fillStyle = '#2f6b33'; g.beginPath(); g.arc(px + 20, py + 6, 19, 0, 7); g.fill();
        g.fillStyle = '#3f8440'; g.beginPath(); g.arc(px + 15, py + 1, 11, 0, 7); g.fill();
      } else if (t === BUSH) {
        g.fillStyle = '#356f33'; g.beginPath(); g.arc(px + 12, py + 24, 12, 0, 7); g.arc(px + 28, py + 24, 12, 0, 7); g.arc(px + 20, py + 14, 13, 0, 7); g.fill();
        g.fillStyle = '#458743'; g.beginPath(); g.arc(px + 17, py + 13, 6, 0, 7); g.arc(px + 28, py + 21, 5, 0, 7); g.fill();
      }
    }
    while (ei < ents.length && Math.floor(ents[ei].y / T) <= ty) {
      const e = ents[ei++];
      if (e.p) { g.globalAlpha = p.hid ? .5 : 1; drawGuy(g, p.x, p.y + 8, p.ph, p.dir, p.back, p.moving); g.globalAlpha = 1; }
      else drawCop(g, e.c);
    }
  }
  g.font = '700 15px Bungee, Impact, sans-serif'; g.textAlign = 'center';
  for (const f of floats) { g.globalAlpha = Math.max(0, 1 - f.t); g.fillStyle = '#000'; g.fillText(f.txt, f.x + 1, f.y + 1); g.fillStyle = f.c; g.fillText(f.txt, f.x, f.y); }
  g.globalAlpha = 1;

  // screen space: siren glow + arrows to off-screen cops
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (state === 'play') {
    let near = 1e9;
    for (const c of cops) {
      const d = Math.hypot(c.x - p.x, c.y - p.y); if (c.mode === 'chase') near = Math.min(near, d);
      const sx = (c.x - camX) * zoom, sy = (c.y - 20 - camY) * zoom;
      if (sx < 0 || sy < 0 || sx > vw || sy > vh) {
        const m = 26, ax = Math.max(m, Math.min(vw - m, sx)), ay = Math.max(m + 40, Math.min(vh - m, sy));
        const a = Math.atan2(sy - ay, sx - ax);
        g.save(); g.translate(ax, ay); g.rotate(a);
        g.fillStyle = c.mode === 'chase' ? (Math.floor(time * 5) % 2 ? '#ff3b4e' : '#3d7bff') : '#ffffff80';
        g.beginPath(); g.moveTo(12, 0); g.lineTo(-8, -9); g.lineTo(-8, 9); g.closePath(); g.fill(); g.restore();
      }
    }
    if (seen && near < 300) {
      const a = (1 - near / 300) * .35, red = Math.floor(time * 4) % 2;
      const gr = g.createRadialGradient(vw / 2, vh / 2, Math.min(vw, vh) * .35, vw / 2, vh / 2, Math.max(vw, vh) * .7);
      gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, red ? `rgba(255,59,78,${a})` : `rgba(61,123,255,${a})`);
      g.fillStyle = gr; g.fillRect(0, 0, vw, vh);
    }
  }
}

const mini = $('mini'), mg = mini.getContext('2d');
function hud() {
  $('score').textContent = score().toLocaleString('pl-PL');
  $('stars').innerHTML = '★'.repeat(level) + '<i>' + '★'.repeat(5 - level) + '</i>';
  const bar = $('bar'); bar.firstElementChild.style.width = (player.boost > 0 ? 100 : player.stam * 100) + '%';
  bar.classList.toggle('boost', player.boost > 0);
  const st = $('status');
  st.className = seen ? 'seen' : player.hid ? 'hid' : '';
  st.textContent = seen ? 'Widzą cię!' : player.hid ? 'Ukryty w krzakach' : 'Szukają cię';
  mg.drawImage(miniBase, 0, 0);
  for (const c of cops) { mg.fillStyle = Math.floor(time * 4) % 2 ? '#ff3b4e' : '#3d7bff'; mg.fillRect(c.x / T * 2 - 2, c.y / T * 2 - 2, 4, 4); }
  mg.fillStyle = '#fff'; mg.fillRect(player.x / T * 2 - 3, player.y / T * 2 - 3, 6, 6);
  mg.fillStyle = '#6f8a35'; mg.fillRect(player.x / T * 2 - 2, player.y / T * 2 - 2, 4, 4);
}

/* ---------- loop ---------- */
let last = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  if (state === 'play') { update(dt); hud(); }
  else if (state === 'menu') { time += dt; player.x = (W * T / 2) + Math.cos(time * .15) * 500; player.y = (H * T / 2) + Math.sin(time * .2) * 350; }
  render();
  requestAnimationFrame(frame);
}
function startGame() {
  reset(); state = 'play';
  $('menu').hidden = true; $('over').hidden = true; $('hudL').hidden = false; $('mini').hidden = false;
  if (isTouch) sprintBtn.hidden = false;
  beep(440, .15, 'square', .04, 660);
}
$('start').addEventListener('click', startGame);
$('again').addEventListener('click', startGame);
addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') isTouch = true; }, true);

// menu portrait
(function hero() {
  const h = $('hero'), g = h.getContext('2d'); let t = 0;
  (function tick() {
    if (state === 'menu') {
      t += .12; g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 300, 340); g.setTransform(6, 0, 0, 6, 150, 320);
      drawGuy(g, 0, 0, t, 1, false, true);
    }
    requestAnimationFrame(tick);
  })();
})();

reset(); cops = []; items = []; resize();
window.__game = { get state() { return state; }, get player() { return player; }, get cops() { return cops; } };
requestAnimationFrame(frame);
})();
</script>
